# Creates the GitHub release and git tag for a version once the General registry merges it.
#
# TagBot pushes the tag with GITHUB_TOKEN, and a GITHUB_TOKEN push does not trigger other workflows —
# so the tag does not build versioned documentation by itself. Run the Documentation workflow from
# the Actions tab (it has workflow_dispatch) after a release, or add a DOCUMENTER_KEY secret and an
# `ssh:` input here to automate it. The `dev` docs are unaffected: they build on every push to main.
name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        description: Days of registry history to scan
        default: '3'

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
