JuMP = "4076af6c-e467-56ae-b986-b466b2749572"
ModularSystems = "2d7e785c-34a0-4c77-8d27-e41cd38ddb12"

[compat]
Documenter = "1"
Ipopt = "1"
JuMP = "1"
